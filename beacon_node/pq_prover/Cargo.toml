[package]
name = "pq_prover"
version = "0.1.0"
edition = { workspace = true }

[features]
# Use the fake XMSS scheme. leanVM's prover rejects fake signatures: use the reference backend
# with this feature.
fake_crypto = ["xmss/fake_crypto"]
# The in-process leanVM prover backend.
leanvm = ["dep:lean_vm"]

[dependencies]
lean_vm = { workspace = true, optional = true }
lean_xmss = { workspace = true }
leanvm_claims = { workspace = true }
thiserror = { workspace = true }
xmss = { workspace = true }
